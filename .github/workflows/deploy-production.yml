name: Deploy to production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Checkout (for the prod compose file)
        uses: actions/checkout@v4

      - name: Push prod compose
        run: |
          rsync -e "ssh -i ~/.ssh/id_ed25519" --mkpath docker-compose.prod.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/apps/shop/docker-compose.prod.yml

      - name: Push shop_back/.env (from secret)
        run: |
          cat > /tmp/shop_back.env <<'EOF'
          ${{ secrets.BACKEND_ENV }}
          EOF
          rsync -e "ssh -i ~/.ssh/id_ed25519" --mkpath /tmp/shop_back.env \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/apps/shop/shop_back/.env
          rm /tmp/shop_back.env

      - name: Pull, migrate, restart on prod
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'EOF'
            set -e
            cd ~/apps/shop
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T shop_back python manage.py migrate --noinput
            docker image prune -f
            sleep 5
            curl -fsS http://localhost:4010/ > /dev/null && echo "smoke OK" || { echo "smoke FAILED"; exit 1; }
            docker ps --filter "name=shop_"
          EOF
