name: Build & push images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # If shop_back / shop_front are PRIVATE, the default token can't read them —
          # set a PAT secret with repo access and uncomment:
          # token: ${{ secrets.SUBMODULE_PAT }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write env files (from secrets)
        run: |
          cat > shop_back/.env <<'EOF'
          ${{ secrets.BACKEND_ENV }}
          EOF
          cat > shop_front/.env <<'EOF'
          ${{ secrets.FRONTEND_ENV }}
          EOF

      - name: Generate static (front export + back collectstatic)
        run: make generate-static

      - name: Build & push prod images
        run: |
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml push
