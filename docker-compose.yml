# Dev stack — builds locally with hot-reload volumes.
#   docker compose up                  # db + redis + back + front + nginx
#   docker compose --profile test up   # + test runner + e2e
#   docker compose --profile static up # one-off static generation
# Production is a separate file that PULLS images: docker-compose.prod.yml
x-back-dev: &back-dev
  image: allania7med11/shop_back:latest
  build:
    context: ./shop_back
    args:
      DEV_BUILD: true
  volumes:
    - ./shop_back:/app
    - vector_indexes:/vector_indexes
  env_file:
    - ./shop_back/.env
  environment:
    - PYTHONUNBUFFERED=1
    # Reach db/redis over the compose network (overrides .env localhost, which
    # only works for a non-containerized run).
    - POSTGRES_HOST=db
    - REDIS_URL=redis://redis:6379/0
  depends_on:
    - db
    - redis

services:
  db:
    container_name: shop_db
    image: postgres:17
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db:/app
      - ./db/shop_db_init.sql:/docker-entrypoint-initdb.d/shop_db_init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5443:5432"

  redis:
    container_name: shop_redis
    image: redis:alpine
    restart: always
    ports:
      - "6399:6379"
    volumes:
      - redis_data:/data

  shop_back:
    container_name: shop_back
    <<: *back-dev
    ports:
      - "8010:2031"

  shop_front:
    container_name: shop_front
    build:
      context: ./shop_front
    env_file: ./shop_front/.env
    volumes:
      - ./shop_front:/app
      - node_modules_front:/app/node_modules
    ports:
      - "3010:3000"

  nginx:
    container_name: shop_nginx
    image: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "4001:80"
    depends_on:
      - shop_back
      - shop_front

  # --- optional one-off tooling (not started by default) ---
  shop_back_static:
    container_name: shop_back_static
    <<: *back-dev
    environment:
      - ENVIRONMENT=static
    tty: true
    stdin_open: true
    profiles: ["static"]

  shop_front_static:
    container_name: shop_front_static
    build:
      context: ./shop_front
    env_file: ./shop_front/.env
    environment:
      - ENVIRONMENT=static
    volumes:
      - ./shop_front:/app
      - node_modules_front:/app/node_modules
    tty: true
    stdin_open: true
    profiles: ["static"]

  shop_back_test:
    container_name: shop_back_test
    <<: *back-dev
    environment:
      - ENVIRONMENT=test
    profiles: ["test"]

  shop_e2e:
    container_name: shop_e2e
    build:
      context: ./shop_e2e
    env_file: ./shop_e2e/.env
    volumes:
      - ./shop_e2e:/app
      - node_modules_e2e:/app/node_modules
    profiles: ["test"]

volumes:
  postgres_data:
  vector_indexes:
  node_modules_front:
  node_modules_e2e:
  redis_data:
