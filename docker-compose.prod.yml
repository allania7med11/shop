# Production stack — PULLS prebuilt images (no local build).
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# .env is generated by GitHub Actions at deploy time (same as the other projects).
x-back-prod: &back-prod
  image: allania7med11/shop_back:latest
  env_file:
    - ./shop_back/.env
  volumes:
    - vector_indexes:/vector_indexes
  restart: always
  depends_on:
    - redis

services:
  redis:
    container_name: shop_redis
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data

  shop_back:
    container_name: shop_back_prod
    <<: *back-prod
    environment:
      - ENVIRONMENT=prod

  shop_worker:
    container_name: shop_worker_prod
    <<: *back-prod
    environment:
      - ENVIRONMENT=celery_worker

  shop_beat:
    container_name: shop_beat_prod
    <<: *back-prod
    environment:
      - ENVIRONMENT=celery_beat

  nginx:
    container_name: shop_nginx_prod
    image: allania7med11/shop_nginx_prod:latest
    ports:
      - "4010:80"
    volumes:
      - ./nginx_prod/nginx.conf:/etc/nginx/nginx.conf
      - ./shop_front/shop_front:/var/www/shop_front
      - ./shop_back/shop_back_static:/var/www/shop_back_static
      - ./nginx_prod/log:/var/log/nginx
    depends_on:
      - shop_back

volumes:
  vector_indexes:
  redis_data:
