# Production stack — images are built+pushed by CI (build job) and PULLED here.
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# Static (front + back) is generated before build and baked into the nginx image.
# .env is generated by GitHub Actions at deploy time.
x-back-prod: &back-prod
  image: ghcr.io/allania7med11/shop_back:latest
  env_file:
    - ./shop_back/.env
  volumes:
    - vector_indexes:/vector_indexes
  restart: always
  depends_on:
    - redis

services:
  redis:
    container_name: shop_redis
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data

  shop_back:
    container_name: shop_back_prod
    <<: *back-prod
    build:
      context: ./shop_back
    environment:
      - ENVIRONMENT=prod

  shop_worker:
    container_name: shop_worker_prod
    <<: *back-prod
    environment:
      - ENVIRONMENT=celery_worker

  shop_beat:
    container_name: shop_beat_prod
    <<: *back-prod
    environment:
      - ENVIRONMENT=celery_beat

  nginx:
    container_name: shop_nginx_prod
    image: ghcr.io/allania7med11/shop_nginx_prod:latest
    build:
      context: .
      dockerfile: nginx_prod/Dockerfile
    ports:
      - "4010:80"
    depends_on:
      - shop_back

volumes:
  vector_indexes:
  redis_data:
